{% extends "base.html" %}
{% block title %}Domotique - Accueil{% endblock %}
{% block content %}
<div class="container mt-4">
    <div class="d-flex flex-column align-items-center">
        <a href="{{ url_for('domotique.domotique_pieces') }}"
           class="card w-100 text-center shadow-sm text-decoration-none mb-3"
           style="max-width: 400px;">
            <div class="card-body d-flex flex-column justify-content-center py-4">
                <h5 class="card-title">Pièces</h5>
            </div>
        </a>
        <a href="{{ url_for('domotique.domotique_eclairage') }}"
           class="card w-100 text-center shadow-sm text-decoration-none mb-3"
           style="max-width: 400px;">
            <div class="card-body d-flex flex-column justify-content-center py-4">
                <h5 class="card-title">Éclairage</h5>
            </div>
        </a>
        <a href="{{ url_for('domotique.domotique_volets') }}"
           class="card w-100 text-center shadow-sm text-decoration-none mb-3"
           style="max-width: 400px;">
            <div class="card-body d-flex flex-column justify-content-center py-4">
                <h5 class="card-title">Volets</h5>
            </div>
        </a>
        <a href="{{ url_for('domotique.domotique_thermometres') }}"
           class="card w-100 text-center shadow-sm text-decoration-none mb-3"
           style="max-width: 400px;">
            <div class="card-body d-flex flex-column justify-content-center py-4">
                <h5 class="card-title">Thermomètres</h5>
            </div>
        </a>
        <a href="{{ url_for('domotique.domotique_devices') }}"
           class="card w-100 text-center shadow-sm text-decoration-none mb-3"
           style="max-width: 400px;">
            <div class="card-body d-flex flex-column justify-content-center py-4">
                <h5 class="card-title">Appareils</h5>
            </div>
        </a>
    </div>
</div>
{% endblock %}
